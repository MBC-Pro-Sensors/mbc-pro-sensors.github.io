        window.location.hash = currentHash.replace('#/', '#/en/');
        // Check if on root README to switch to en/README
        if (window.location.hash === '#/en/') {
           // Actually just #/en/ is fine for Docsify
        }
      }
    });

    function updateLangBtn() {
      var currentHash = window.location.hash || '#/';
      if (currentHash.startsWith('#/en/')) {
        document.getElementById('lang-text').innerText = '中文';
      } else {
        document.getElementById('lang-text').innerText = 'EN';
      }
    }
    window.addEventListener('hashchange', updateLangBtn);
    updateLangBtn();
    
    var btn = document.getElementById('lang-toggle-btn');
    btn.addEventListener('mouseenter', function() { this.style.transform = 'scale(1.05)'; this.style.background = '#0ABAB5'; });
    btn.addEventListener('mouseleave', function() { this.style.transform = 'scale(1)'; this.style.background = 'rgba(10,186,181,0.9)'; });
  </script>
</body>
</html>
